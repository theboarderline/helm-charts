suite: external-secrets prefix feature
templates:
  - external-secrets.yaml

# Document index convention (IAP disabled):
#   0 = SecretStore
#   1 = app-secrets ExternalSecret

tests:

  - it: renders nothing when local is true
    set:
      enabled: true
      local: true
      lifecycle: dev
      app_code: test
      domain: example.com
      external_secrets:
        enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when external_secrets disabled
    set:
      enabled: true
      local: false
      lifecycle: dev
      app_code: test
      domain: example.com
      external_secrets:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: federates off GKE, so no key backs the store
    set:
      enabled: true
      local: false
      lifecycle: dev
      app_code: test
      domain: example.com
      google:
        gke_project: ""
        federation:
          audience: //iam.googleapis.com/projects/1/locations/global/workloadIdentityPools/datacenter/providers/us-central1
      external_secrets:
        enabled: true
        credentials_secret: gcp-secret-manager
    asserts:
      - documentIndex: 0
        equal:
          path: spec.provider.gcpsm.auth.workloadIdentityFederation
          value:
            audience: //iam.googleapis.com/projects/1/locations/global/workloadIdentityPools/datacenter/providers/us-central1
            serviceAccountRef:
              name: test-sa

  - it: keeps GKE workload identity when the cluster is GKE, audience or not
    set:
      enabled: true
      local: false
      lifecycle: dev
      app_code: test
      domain: example.com
      primary_cluster_name: central-cluster
      google:
        gke_project: some-gke-project
        zone: us-central1-a
        federation:
          audience: //iam.googleapis.com/projects/1/locations/global/workloadIdentityPools/datacenter/providers/us-central1
      external_secrets:
        enabled: true
    asserts:
      - documentIndex: 0
        equal:
          path: spec.provider.gcpsm.auth.workloadIdentity.clusterProjectID
          value: some-gke-project
      - documentIndex: 0
        notExists:
          path: spec.provider.gcpsm.auth.workloadIdentityFederation

  - it: falls back to the key when neither GKE nor an audience is configured
    set:
      enabled: true
      local: false
      lifecycle: dev
      app_code: test
      domain: example.com
      google:
        gke_project: ""
        federation:
          audience: ""
      external_secrets:
        enabled: true
        credentials_secret: gcp-secret-manager
        credentials_key: credentials.json
    asserts:
      - documentIndex: 0
        equal:
          path: spec.provider.gcpsm.auth.secretRef.secretAccessKeySecretRef.name
          value: gcp-secret-manager

  - it: renders SecretStore and app-secrets ExternalSecret by default
    set:
      enabled: true
      local: false
      lifecycle: dev
      app_code: test
      domain: example.com
      external_secrets:
        enabled: true
        secret_prefix: ""
        extra_keys: []
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        isKind:
          of: SecretStore
      - documentIndex: 1
        isKind:
          of: ExternalSecret
      - documentIndex: 1
        equal:
          path: metadata.name
          value: app-secrets

  - it: secret_prefix empty renders key unchanged
    set:
      enabled: true
      local: false
      lifecycle: dev
      app_code: test
      domain: example.com
      external_secrets:
        enabled: true
        secret_prefix: ""
        extra_keys: []
      django:
        enabled: true
    asserts:
      - documentIndex: 1
        contains:
          path: spec.data
          content:
            secretKey: django-key
            remoteRef:
              key: django-key

  - it: secret_prefix set prepends to remoteRef key
    set:
      enabled: true
      local: false
      lifecycle: lswingz-42
      app_code: test
      domain: example.com
      external_secrets:
        enabled: true
        secret_prefix: "lswingz-42-"
        extra_keys: []
      django:
        enabled: true
    asserts:
      - documentIndex: 1
        contains:
          path: spec.data
          content:
            secretKey: django-key
            remoteRef:
              key: lswingz-42-django-key

  - it: extra_keys entries are included without prefix
    set:
      enabled: true
      local: false
      lifecycle: dev
      app_code: test
      domain: example.com
      external_secrets:
        enabled: true
        secret_prefix: ""
        extra_keys:
          - my-custom-key
    asserts:
      - documentIndex: 1
        contains:
          path: spec.data
          content:
            secretKey: my-custom-key
            remoteRef:
              key: my-custom-key

  - it: extra_keys entries get prefix for ephemeral lifecycle
    set:
      enabled: true
      local: false
      lifecycle: lswingz-42
      app_code: test
      domain: example.com
      external_secrets:
        enabled: true
        secret_prefix: "lswingz-42-"
        extra_keys:
          - my-custom-key
    asserts:
      - documentIndex: 1
        contains:
          path: spec.data
          content:
            secretKey: my-custom-key
            remoteRef:
              key: lswingz-42-my-custom-key
