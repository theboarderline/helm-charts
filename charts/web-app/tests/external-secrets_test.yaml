suite: external-secrets prefix feature
templates:
  - external-secrets.yaml

# Document index convention (IAP disabled):
#   0 = SecretStore
#   1 = app-secrets ExternalSecret

tests:

  - it: renders nothing when local is true
    set:
      enabled: true
      local: true
      lifecycle: dev
      app_code: test
      domain: example.com
      external_secrets:
        enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when external_secrets disabled
    set:
      enabled: true
      local: false
      lifecycle: dev
      app_code: test
      domain: example.com
      external_secrets:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders SecretStore and app-secrets ExternalSecret by default
    set:
      enabled: true
      local: false
      lifecycle: dev
      app_code: test
      domain: example.com
      external_secrets:
        enabled: true
        secret_prefix: ""
        extra_keys: []
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        isKind:
          of: SecretStore
      - documentIndex: 1
        isKind:
          of: ExternalSecret
      - documentIndex: 1
        equal:
          path: metadata.name
          value: app-secrets

  - it: secret_prefix empty renders key unchanged
    set:
      enabled: true
      local: false
      lifecycle: dev
      app_code: test
      domain: example.com
      external_secrets:
        enabled: true
        secret_prefix: ""
        extra_keys: []
      django:
        enabled: true
    asserts:
      - documentIndex: 1
        contains:
          path: spec.data
          content:
            secretKey: django-key
            remoteRef:
              key: django-key

  - it: secret_prefix set prepends to remoteRef key
    set:
      enabled: true
      local: false
      lifecycle: lswingz-42
      app_code: test
      domain: example.com
      external_secrets:
        enabled: true
        secret_prefix: "lswingz-42-"
        extra_keys: []
      django:
        enabled: true
    asserts:
      - documentIndex: 1
        contains:
          path: spec.data
          content:
            secretKey: django-key
            remoteRef:
              key: lswingz-42-django-key

  - it: extra_keys entries are included without prefix
    set:
      enabled: true
      local: false
      lifecycle: dev
      app_code: test
      domain: example.com
      external_secrets:
        enabled: true
        secret_prefix: ""
        extra_keys:
          - my-custom-key
    asserts:
      - documentIndex: 1
        contains:
          path: spec.data
          content:
            secretKey: my-custom-key
            remoteRef:
              key: my-custom-key

  - it: extra_keys entries get prefix for ephemeral lifecycle
    set:
      enabled: true
      local: false
      lifecycle: lswingz-42
      app_code: test
      domain: example.com
      external_secrets:
        enabled: true
        secret_prefix: "lswingz-42-"
        extra_keys:
          - my-custom-key
    asserts:
      - documentIndex: 1
        contains:
          path: spec.data
          content:
            secretKey: my-custom-key
            remoteRef:
              key: lswingz-42-my-custom-key
