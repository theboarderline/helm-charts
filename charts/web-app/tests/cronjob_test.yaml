suite: cronjob template
templates:
  - cronjob.yaml

tests:

  - it: runs a multi-arch curl image, because httpie publishes no arm64 build
    set:
      enabled: true
      lifecycle: dev
      app_code: test
      domain: example.com
      cronjobs:
        enabled: true
        jobs:
          - name: reschedule
            endpoint: jobs/reschedule
    asserts:
      - matchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          pattern: "^curlimages/curl:"

  - it: renders headers as curl --header args and omits the legacy body-field
    set:
      enabled: true
      lifecycle: dev
      app_code: test
      domain: example.com
      cronjobs:
        enabled: true
        jobs:
          - name: reschedule
            schedule: "0 8 * * *"
            endpoint: "jobs/reschedule?status=incomplete"
            headers:
              Authorization: "Bearer $(API_KEY)"
    asserts:
      - hasDocuments:
          count: 1
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].args
          content: "--header"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].args
          content: "Authorization: Bearer $(API_KEY)"
      - notContains:
          path: spec.jobTemplate.spec.template.spec.containers[0].args
          content: '{"key": "$(API_KEY)"}'
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].args
          content: "POST"

  - it: sends the legacy body-field as JSON when no headers are configured
    set:
      enabled: true
      lifecycle: dev
      app_code: test
      domain: example.com
      cronjobs:
        enabled: true
        jobs:
          - name: legacy
            schedule: "0 14 * * *"
            endpoint: legacy-endpoint
    asserts:
      - hasDocuments:
          count: 1
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].args
          content: "--json"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].args
          content: '{"key": "$(API_KEY)"}'

  - it: fails the job on an HTTP error status instead of exiting zero
    set:
      enabled: true
      lifecycle: dev
      app_code: test
      domain: example.com
      cronjobs:
        enabled: true
        jobs:
          - name: reschedule
            endpoint: jobs/reschedule
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].args
          content: "--fail-with-body"

  - it: gives curl an absolute URL, which it will not infer the way httpie did
    set:
      enabled: true
      lifecycle: dev
      app_code: test
      domain: example.com
      cronjobs:
        enabled: true
        jobs:
          - name: reschedule
            endpoint: "jobs/reschedule?status=incomplete"
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].args
          content: "http://api-svc.NAMESPACE.svc/api/jobs/reschedule?status=incomplete"

  - it: skips a job marked enabled false and keeps a job that omits the key
    set:
      enabled: true
      lifecycle: dev
      app_code: test
      domain: example.com
      cronjobs:
        enabled: true
        jobs:
          - name: turned-off
            endpoint: turned-off-endpoint
            enabled: false
          - name: no-key
            endpoint: no-key-endpoint
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: cronjob-no-key

  - it: renders nothing when cronjobs are disabled
    set:
      enabled: true
      lifecycle: dev
      app_code: test
      domain: example.com
      cronjobs:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
