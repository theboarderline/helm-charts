suite: google credentials off GKE
templates:
  - google-credentials.yaml

tests:

  - it: renders nothing on GKE, where the metadata server answers
    set:
      enabled: true
      lifecycle: dev
      app_code: test
      domain: example.com
      google:
        region: us-central1
    asserts:
      - hasDocuments:
          count: 0

  - it: writes a credentials file that names the projected token as its source
    set:
      enabled: true
      lifecycle: dev
      app_code: test
      domain: example.com
      google:
        region: us-central1
        federation:
          audience: //iam.googleapis.com/projects/1/locations/global/workloadIdentityPools/p/providers/v
    asserts:
      - equal:
          path: metadata.name
          value: json-credentials
      - matchRegex:
          path: stringData["credentials.json"]
          pattern: '"type": "external_account"'
      - matchRegex:
          path: stringData["credentials.json"]
          pattern: '"file": "/var/run/secrets/gcp/token"'

  - it: carries no key material of any kind
    set:
      enabled: true
      lifecycle: dev
      app_code: test
      domain: example.com
      google:
        region: us-central1
        federation:
          audience: //iam.googleapis.com/projects/1/locations/global/workloadIdentityPools/p/providers/v
    asserts:
      - notMatchRegex:
          path: stringData["credentials.json"]
          pattern: private_key

  - it: impersonates the app's own workload account, so its existing grants apply
    set:
      enabled: true
      lifecycle: dev
      app_code: test
      domain: example.com
      google:
        region: us-central1
        app_project: test-app-project
        federation:
          audience: //iam.googleapis.com/projects/1/locations/global/workloadIdentityPools/p/providers/v
    asserts:
      - matchRegex:
          path: stringData["credentials.json"]
          pattern: 'serviceAccounts/test-workload@test-app-project\.iam\.gserviceaccount\.com:generateAccessToken'
