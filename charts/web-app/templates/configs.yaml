{{- if .Values.enabled }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: react-config
  namespace: {{ .Release.Namespace }}
data:
  env.js: |
    window.LIFECYCLE = '{{- include "lifecycle" $ -}}';
    {{- range .Values.google.storage.bucket_list }}
    window.{{ .key }} = '{{ include "app_label" $ -}}-{{- .name }}';
    {{- end }}
    {{- if and .Values.stripe .Values.stripe.enabled }}
    window.STRIPE_PUBLIC_KEY = '{{- .Values.stripe.public_key -}}';
    {{- end }}
    {{- if .Values.api.enabled }}
    window.API_URL = 'https://{{- include "subdomain" . -}}/';
    {{- end }}
    {{- if .Values.firebase.enabled }}
    window.AUTH_DOMAIN = '{{- include "app_project" . -}}.firebaseapp.com';
    {{- end }}
    {{- if .Values.google.number }}
    window.GOOGLE_NUMBER = '{{- .Values.google.number -}}';
    {{- end }}

---

{{- if .Values.api.enabled }}


apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: {{ .Release.Namespace }}
data:
  api.conf: |
    # — WebSocket + HTTP API proxy —
    # Detect and handle WebSocket upgrades
    location /api/ {
        # If this is a WebSocket handshake, proxy with upgrade headers
        if ($http_upgrade = "websocket") {
            proxy_pass http://api-svc.{{ .Release.Namespace }}.svc;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
            break;
        }

        # Otherwise normal HTTP API proxy
        proxy_set_header Host {{ include "subdomain" . }};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://api-svc.{{ .Release.Namespace }}.svc;
    }

    {{- if .Values.django.enabled }}
    location /admin/ {
        proxy_set_header Host {{ include "subdomain" . }};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://api-svc.{{ .Release.Namespace }}.svc;
    }
    location /accounts/ {
        proxy_set_header Host {{ include "subdomain" . }};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://api-svc.{{ .Release.Namespace }}.svc;
    }
    {{- end }}

{{- end }}

{{- end }}
