{{- if .Values.enabled }}
{{- if and (.Values.fqdn_network_policy.enabled) (.Values.google.gke) }}

apiVersion: networking.gke.io/v1alpha3
kind: FQDNNetworkPolicy
metadata:
  name: fqdn-network-policy
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
      - fqdns:
        {{- range .Values.fqdn_network_policy.fqdns }}
        - {{ . | quote }}
        {{- end }}
        ports:
        - port: 443
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 35.191.0.0/16
    - to:
        - ipBlock:
            cidr: 130.211.0.0/22
      ports:
        - port: 443
    - to:
      - namespaceSelector: {}
    - to:
      - namespaceSelector: {}
        podSelector:
          matchLabels:
            k8s-app: kube-dns
        ports:
          - port: 53
            protocol: UDP

  ingress:
    - from:
        - namespaceSelector: {}
    - from:
        - ipBlock:
            cidr: 130.211.0.0/22
    - from:
        - ipBlock:
            cidr: 35.191.0.0/16


{{- end }}
{{- end }}
