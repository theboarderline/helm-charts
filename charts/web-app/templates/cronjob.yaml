{{- if .Values.cronjobs.enabled }}

{{- range .Values.cronjobs.jobs }}
{{- $turnedOff := eq (toString .enabled) "false" }}
{{- if not $turnedOff }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob-{{ .name }}
spec:
  {{- if .schedule }}
  schedule: "{{- .schedule -}}"
  {{- else }}
  schedule: "{{- $.Values.cronjobs.default_schedule -}}"
  {{- end }}
  jobTemplate:
    spec:
      template:
        {{- if $.Values.linkerd.enabled }}
        annotations:
          linkerd.io/inject: enabled
        {{- end }}
        spec:
          hostIPC: false
          hostNetwork: false
          hostPID: false
          securityContext:
            runAsUser: 115
            runAsGroup: 125
            fsGroup: 190
            supplementalGroups:
              - 150
          restartPolicy: Never
          containers:
          - name: http
            image: curlimages/curl:8.11.1
            imagePullPolicy: IfNotPresent

            securityContext:
              allowPrivilegeEscalation: false
              privileged: false
              procMount: Default
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault

            args:
            - --silent
            - --show-error
            - --fail-with-body
            - --request
            - {{ .method | default "POST" }}
            {{- if .headers }}
            {{- range $name, $value := .headers }}
            - --header
            - {{ printf "%s: %s" $name $value | quote }}
            {{- end }}
            {{- else }}
            - --json
            - {{ printf "{\"key\": \"$(API_KEY)\"}" | quote }}
            {{- end }}
            - http://api-svc.{{- $.Release.Namespace -}}.svc/api/{{- .endpoint }}

            env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
            {{- if $.Values.django.enabled }}
                  key: django-key
            {{- else }}
                  key: secret-key
            {{- end }}

---

{{- end }}

{{- end }}

{{- end }}

