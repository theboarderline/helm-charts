{{- if .Values.cronjobs.enabled }}

{{- range .Values.cronjobs.jobs }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob-{{ .name }}
spec:
  {{- if .schedule }}
  schedule: "{{- .schedule -}}"
  {{- else }}
  schedule: "{{- $.Values.cronjobs.default_schedule -}}"
  {{- end }}
  jobTemplate:
    spec:
      template:
        {{- if $.Values.linkerd.enabled }}
        annotations:
          linkerd.io/inject: enabled
        {{- end }}
        spec:
          hostIPC: false
          hostNetwork: false
          hostPID: false
          securityContext:
            runAsUser: 115
            runAsGroup: 125
            fsGroup: 190
            supplementalGroups:
              - 150
          restartPolicy: Never
          containers:
          - name: http
            image: gcr.io/walker-cpl/httpie:0.0.3
            imagePullPolicy: IfNotPresent

            securityContext:
              allowPrivilegeEscalation: false
              privileged: false
              procMount: Default
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault

            args:
            # State the method. httpie infers it from the request items, so a job carrying only headers
            # would otherwise GET an endpoint that only accepts POST, and report success on the 404.
            - {{ .method | default "POST" }}
            - api-svc.{{- $.Release.Namespace -}}.svc/api/{{- .endpoint }}
            {{- if .headers }}
            {{- range $name, $value := .headers }}
            - {{ printf "%s:%s" $name $value | quote }}
            {{- end }}
            {{- else }}
            - key=$(API_KEY)
            {{- end }}
            - --ignore-stdin
            # Exit non-zero on a 4xx/5xx so a broken job shows as a failed pod instead of reporting success.
            - --check-status

            env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
            {{- if $.Values.django.enabled }}
                  key: django-key
            {{- else }}
                  key: secret-key
            {{- end }}

---

{{- end }}

{{- end }}

